<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DUE E-Study — Ôn tập Hệ thống thông tin quản lý (MIS2002)</title>
    <meta
      name="description"
      content="Trang web làm bài trắc nghiệm, tự luận ngắn (điền khuyết) và tự luận kèm kiểm tra đáp án tức thì cho học phần Hệ thống thông tin quản lý (MIS2002)."
    />
    <meta property="og:title" content="DUE E-Study — Ôn tập MIS2002" />
    <meta
      property="og:description"
      content="Bộ đề ôn tập 140 câu hỏi Hệ thống thông tin quản lý (MIS2002): 100 câu trắc nghiệm, 30 câu tự luận ngắn và 10 câu tự luận có đáp án."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('due_mis2002_theme');
          var prefersDark =
            window.matchMedia &&
            window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (saved === 'dark' || (!saved && prefersDark)) {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-[#F8FAFC] dark:bg-[#0B1120] text-[#1E293B] dark:text-[#E2E8F0] antialiased selection:bg-[#C2410C]/15 dark:selection:bg-[#FB923C]/25 selection:text-[#9A3412] dark:selection:text-[#FED7AA]">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
